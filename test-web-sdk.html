<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coze Web SDK 调用限制测试</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel-bg: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --accent-dim: #1d4ed8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
      }
      #sidebar {
        width: 420px;
        min-width: 420px;
        background: var(--panel-bg);
        border-right: 1px solid var(--border);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        height: 100vh;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #chat-container {
        flex: 1;
        position: relative;
      }
      #log-panel {
        height: 200px;
        background: #0a0f1a;
        border-top: 1px solid var(--border);
        padding: 12px;
        overflow-y: auto;
        font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.6;
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.02em;
      }
      .section {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }
      .section h3 {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.15s;
      }
      button:hover {
        background: #2563eb;
      }
      button:disabled {
        background: var(--border);
        cursor: not-allowed;
      }
      button.danger {
        background: var(--danger);
      }
      button.danger:hover {
        background: #dc2626;
      }
      button.outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      button.outline:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat-card {
        background: #0f172a;
        border-radius: 6px;
        padding: 10px;
        text-align: center;
      }
      .stat-value {
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stat-value.success {
        color: var(--success);
      }
      .stat-value.warning {
        color: var(--warning);
      }
      .stat-value.danger {
        color: var(--danger);
      }
      .stat-label {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .log-entry {
        margin-bottom: 2px;
        white-space: nowrap;
      }
      .log-time {
        color: #64748b;
      }
      .log-success {
        color: #22c55e;
      }
      .log-error {
        color: #ef4444;
      }
      .log-warn {
        color: #f59e0b;
      }
      .log-info {
        color: #60a5fa;
      }
      .progress-bar {
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin-top: 4px;
      }
      .progress-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.3s;
      }
      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .status-indicator.idle {
        background: var(--text-secondary);
      }
      .status-indicator.running {
        background: var(--accent);
        animation: pulse 1s infinite;
      }
      .status-indicator.limited {
        background: var(--danger);
      }
      .status-indicator.ok {
        background: var(--success);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .notice {
        background: #382208;
        border: 1px solid #92400e;
        border-radius: 6px;
        padding: 10px;
        font-size: 12px;
        color: #fcd34d;
      }
    </style>
  </head>
  <body>
    <!-- 侧边栏 - 测试控制面板 -->
    <div id="sidebar">
      <h2>🧪 Coze Chat SDK 调用限制测试</h2>

      <div class="section">
        <h3>连接状态</h3>
        <div style="display: flex; align-items: center; gap: 12px">
          <span class="status-indicator" id="statusDot"></span>
          <span id="statusText" style="font-size: 14px">等待配置...</span>
        </div>
      </div>

      <div class="section">
        <h3>配置</h3>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 12px; color: var(--text-secondary)"
            >Bot ID</label
          >
          <input
            id="botIdInput"
            type="text"
            placeholder="输入 Bot ID..."
            style="
              background: #0f172a;
              border: 1px solid var(--border);
              color: var(--text);
              padding: 6px 10px;
              border-radius: 4px;
              font-size: 13px;
            "
          />
          <label style="font-size: 12px; color: var(--text-secondary)"
            >Token (PAT)</label
          >
          <input
            id="tokenInput"
            type="password"
            placeholder="输入 Access Token..."
            style="
              background: #0f172a;
              border: 1px solid var(--border);
              color: var(--text);
              padding: 6px 10px;
              border-radius: 4px;
              font-size: 13px;
            "
          />
          <button class="outline" onclick="initSDK()" style="margin-top: 4px">
            初始化 SDK
          </button>
        </div>
      </div>

      <div class="section">
        <h3>调用统计</h3>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalCalls">0</div>
            <div class="stat-label">总调用次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value success" id="successCalls">0</div>
            <div class="stat-label">成功 (200)</div>
          </div>
          <div class="stat-card">
            <div class="stat-value danger" id="errorCalls">0</div>
            <div class="stat-label">错误/限流</div>
          </div>
          <div class="stat-card">
            <div class="stat-value warning" id="avgLatency">0ms</div>
            <div class="stat-label">平均延迟</div>
          </div>
        </div>
      </div>

      <div class="section notice" id="quotaNotice" style="display: none">
        <strong>⚠️ 文档说明：</strong><br />
        免费版 Chat SDK 累计仅
        <strong>100 次对话</strong>，超出后账号将完全无法使用 SDK。
      </div>

      <div class="section">
        <h3>测试场景</h3>
        <div class="btn-row">
          <button onclick="runScenario('single')" id="btnSingle">
            单次调用
          </button>
          <button onclick="runScenario('low')" id="btnLow">
            低频 (5次/min)
          </button>
          <button onclick="runScenario('normal')" id="btnNormal">
            常态 (20次/min)
          </button>
          <button class="danger" onclick="runScenario('burst')" id="btnBurst">
            突发 (连续10次)
          </button>
          <button class="danger" onclick="runScenario('hunt')" id="btnHunt">
            限额探测 (逐步)
          </button>
          <button class="outline" onclick="stopTest()" id="btnStop" disabled>
            停止
          </button>
          <button class="outline" onclick="resetStats()">重置统计</button>
          <button class="outline" onclick="exportReport()">导出报告</button>
        </div>
        <div class="progress-bar" style="margin-top: 10px">
          <div
            class="progress-fill"
            id="quotaBar"
            style="width: 0%; background: var(--success)"
          ></div>
        </div>
        <div
          style="font-size: 11px; color: var(--text-secondary); margin-top: 4px"
        >
          SDK 配额使用: <span id="quotaPercent">0/100 (0%)</span>
        </div>
      </div>

      <div class="section">
        <h3>实时指标</h3>
        <div
          style="
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
          "
        >
          <div>
            当前 RPM:
            <span id="currentRPM" style="color: var(--accent)">0</span>
          </div>
          <div>最后状态码: <span id="lastStatus">-</span></div>
          <div>最后延迟: <span id="lastLatency">-</span></div>
          <div>
            429 错误数:
            <span id="rateLimitCount" style="color: var(--danger)">0</span>
          </div>
          <div>运行时间: <span id="elapsedTime">0s</span></div>
        </div>
      </div>
    </div>

    <!-- 主区域 -->
    <div id="main">
      <div id="chat-container"></div>
      <div id="log-panel"></div>
    </div>

    <script>
      const MAX_SDK_CONVERSATIONS = 100;

      const state = {
        testRunning: false,
        scenario: null,
        totalCalls: 0,
        successCalls: 0,
        errorCalls: 0,
        rateLimited: 0,
        totalLatency: 0,
        recentTimestamps: [],
        startTime: null,
        abortController: null,
        log: [],
      };

      const $ = (id) => document.getElementById(id);

      function log(msg, type = "info") {
        const now = new Date();
        const time = now.toLocaleTimeString("zh-CN", { hour12: false });
        state.log.push({ time, msg, type });

        const colors = {
          info: "log-info",
          success: "log-success",
          error: "log-error",
          warn: "log-warn",
        };
        const div = document.createElement("div");
        div.className = "log-entry";
        div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colors[type] || "log-info"}">${msg}</span>`;

        $("log-panel").appendChild(div);
        $("log-panel").scrollTop = $("log-panel").scrollHeight;

        if ($("log-panel").children.length > 500) {
          $("log-panel").removeChild($("log-panel").firstChild);
        }
      }

      function updateStats() {
        $("totalCalls").textContent = state.totalCalls;
        $("successCalls").textContent = state.successCalls;
        $("errorCalls").textContent = state.errorCalls;
        $("avgLatency").textContent =
          state.successCalls > 0
            ? Math.round(state.totalLatency / state.successCalls) + "ms"
            : "-";
        $("rateLimitCount").textContent = state.rateLimited;

        const pct = Math.min(
          100,
          (state.totalCalls / MAX_SDK_CONVERSATIONS) * 100,
        );
        $("quotaBar").style.width = pct + "%";
        $("quotaPercent").textContent =
          `${Math.min(state.totalCalls, MAX_SDK_CONVERSATIONS)}/${MAX_SDK_CONVERSATIONS} (${pct.toFixed(1)}%)`;

        if (pct >= 80) {
          $("quotaBar").style.background = "var(--danger)";
          $("quotaNotice").style.display = "block";
        } else if (pct >= 50) {
          $("quotaBar").style.background = "var(--warning)";
        } else {
          $("quotaBar").style.background = "var(--success)";
        }

        const rpm = calcRPM();
        $("currentRPM").textContent = rpm.toFixed(1);

        $("elapsedTime").textContent = state.startTime
          ? Math.round((Date.now() - state.startTime) / 1000) + "s"
          : "-";
      }

      function calcRPM() {
        const now = Date.now();
        state.recentTimestamps = state.recentTimestamps.filter(
          (t) => now - t < 60000,
        );
        return state.recentTimestamps.length;
      }

      function updateStatus(status, text) {
        const dot = $("statusDot");
        dot.className = "status-indicator " + status;
        $("statusText").textContent = text;
      }

      async function initSDK() {
        const botId = $("botIdInput").value.trim();
        const token = $("tokenInput").value.trim();

        if (!botId || !token) {
          log("请填写 Bot ID 和 Token", "warn");
          return;
        }

        updateStatus("running", "初始化中...");
        log("正在初始化 Coze Chat SDK...", "info");

        try {
          if (typeof CozeWebSDK === "undefined") {
            log("CozeWebSDK 未加载，请确保已引入 SDK 脚本", "error");
            updateStatus("idle", "SDK 未加载");
            return;
          }

          const chatContainer = $("chat-container");
          chatContainer.innerHTML = "";

          new CozeWebSDK.WebChatClient({
            config: {
              bot_id: botId,
            },
            componentProps: {
              title: "Coze Chat SDK - 测试模式",
            },
            auth: {
              type: "token",
              token: token,
              onRefreshToken: () => token,
            },
          });

          updateStatus("ok", "SDK 已就绪");
          log("✅ Coze Chat SDK 初始化成功", "success");
        } catch (err) {
          updateStatus("idle", "初始化失败");
          log("SDK 初始化失败: " + err.message, "error");
        }
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function sendChatMessage(query) {
        const startTime = Date.now();

        try {
          const response = await fetch("https://api.coze.cn/v3/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${$("tokenInput").value.trim()}`,
            },
            body: JSON.stringify({
              bot_id: $("botIdInput").value.trim(),
              user_id: "test_user_" + Date.now(),
              stream: false,
              auto_save_history: false,
              additional_messages: [
                { role: "user", content: query, content_type: "text" },
              ],
            }),
          });

          const latency = Date.now() - startTime;

          state.totalCalls++;
          state.recentTimestamps.push(Date.now());

          if (response.status === 200) {
            state.successCalls++;
            state.totalLatency += latency;

            const limitRemaining = response.headers.get(
              "x-ratelimit-remaining",
            );
            const limitLimit = response.headers.get("x-ratelimit-limit");
            $("lastStatus").innerHTML =
              `<span style="color:var(--success)">200 OK</span>`;
            $("lastLatency").textContent = latency + "ms";
            log(
              `✅ HTTP 200 | ${latency}ms | 剩余配额: ${limitRemaining || "N/A"}`,
              "success",
            );

            if (limitRemaining !== null) {
              log(
                `   限流头: limit=${limitLimit} remaining=${limitRemaining}`,
                "info",
              );
            }
          } else if (response.status === 429) {
            state.errorCalls++;
            state.rateLimited++;
            $("lastStatus").innerHTML =
              `<span style="color:var(--danger)">429 Too Many Requests</span>`;
            $("lastLatency").textContent = latency + "ms";

            const retryAfter = response.headers.get("retry-after");
            log(
              `🔴 HTTP 429 限流! ${latency}ms | Retry-After: ${retryAfter || "N/A"}s`,
              "error",
            );
            updateStatus("limited", "触发限流 429");
          } else {
            state.errorCalls++;
            const body = await response.text();
            $("lastStatus").innerHTML =
              `<span style="color:var(--warning)">${response.status} ${response.statusText}</span>`;
            $("lastLatency").textContent = latency + "ms";
            log(
              `⚠️ HTTP ${response.status} | ${latency}ms | ${body.substring(0, 100)}`,
              "warn",
            );
          }

          updateStats();
          return { status: response.status, latency };
        } catch (err) {
          state.errorCalls++;
          state.totalCalls++;
          state.recentTimestamps.push(Date.now());
          const latency = Date.now() - startTime;

          $("lastStatus").innerHTML =
            `<span style="color:var(--danger)">NET ERR</span>`;
          $("lastLatency").textContent = latency + "ms";
          log(`❌ 网络错误: ${err.message}`, "error");
          updateStats();
          return { status: 0, latency, error: err.message };
        }
      }

      async function runScenario(type) {
        if (state.testRunning) {
          log("已有测试在运行中", "warn");
          return;
        }

        state.testRunning = true;
        state.startTime = Date.now();
        updateStatus("running", "测试运行中...");

        const buttons = [
          "btnSingle",
          "btnLow",
          "btnNormal",
          "btnBurst",
          "btnHunt",
        ];
        buttons.forEach((id) => {
          if ($(id)) $(id).disabled = true;
        });
        $("btnStop").disabled = false;

        log(`🚀 开始测试场景: ${type}`, "info");

        try {
          switch (type) {
            case "single":
              await sendChatMessage("单次测试消息");
              break;

            case "low":
              for (let i = 0; i < 10 && state.testRunning; i++) {
                await sendChatMessage(`低频测试 ${i + 1}`);
                await sleep(12000);
              }
              break;

            case "normal":
              for (let i = 0; i < 30 && state.testRunning; i++) {
                await sendChatMessage(`常态测试 ${i + 1}`);
                await sleep(3000);
              }
              break;

            case "burst":
              for (let i = 0; i < 10 && state.testRunning; i++) {
                await sendChatMessage(`突发测试 ${i + 1}`);
                await sleep(300);
              }
              break;

            case "hunt":
              log("🔍 限额探测：逐步增加频率直到触发限流...", "info");
              let delay = 5000;
              for (let step = 0; step < 50 && state.testRunning; step++) {
                const result = await sendChatMessage(`探测 ${step + 1}`);
                if (result.status === 429) {
                  log(`💥 在 ${step + 1} 次请求后触发限流!`, "error");
                  log("   等待 65 秒恢复后继续验证...", "info");
                  await sleep(65000);
                  const verify = await sendChatMessage("限流恢复验证");
                  if (verify.status === 200) {
                    log("✅ 限流窗口已重置，请求恢复成功", "success");
                  } else {
                    log(`⚠️ 恢复验证失败: HTTP ${verify.status}`, "warn");
                  }
                }
                delay = Math.max(200, delay - 100);
                await sleep(delay);
              }
              break;
          }
        } finally {
          state.testRunning = false;
          buttons.forEach((id) => {
            if ($(id)) $(id).disabled = false;
          });
          $("btnStop").disabled = true;
          updateStatus("ok", "测试完成");
          log(`🏁 测试场景 "${type}" 完成`, "info");
          updateStats();
        }
      }

      function stopTest() {
        state.testRunning = false;
        log("⏹ 用户手动停止测试", "warn");
        $("btnStop").disabled = true;
        updateStatus("idle", "测试已停止");
      }

      function resetStats() {
        Object.assign(state, {
          totalCalls: 0,
          successCalls: 0,
          errorCalls: 0,
          rateLimited: 0,
          totalLatency: 0,
          recentTimestamps: [],
          startTime: null,
        });
        $("lastStatus").textContent = "-";
        $("lastLatency").textContent = "-";
        $("quotaBar").style.width = "0%";
        $("quotaBar").style.background = "var(--success)";
        $("quotaPercent").textContent = "0/100 (0%)";
        $("quotaNotice").style.display = "none";
        updateStats();
        updateStatus("ok", "统计已重置");
        log("🔄 统计数据已重置", "info");
      }

      function exportReport() {
        const report = {
          exportTime: new Date().toISOString(),
          stats: {
            totalCalls: state.totalCalls,
            successCalls: state.successCalls,
            errorCalls: state.errorCalls,
            rateLimited: state.rateLimited,
            avgLatencyMs:
              state.successCalls > 0
                ? Math.round(state.totalLatency / state.successCalls)
                : 0,
            currentRPM: calcRPM(),
            quotaUsagePercent: (
              (state.totalCalls / MAX_SDK_CONVERSATIONS) *
              100
            ).toFixed(1),
          },
          config: {
            botId: $("botIdInput").value.trim() ? "***" : "未配置",
            token: $("tokenInput").value.trim() ? "***" : "未配置",
            sdkQuotaLimit: MAX_SDK_CONVERSATIONS,
          },
          logs: state.log,
        };

        const blob = new Blob([JSON.stringify(report, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `coze-sdk-test-report-${Date.now().toString(36)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        log("📥 测试报告已导出", "success");
      }
    </script>
  </body>
</html>
